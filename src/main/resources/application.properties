spring.application.name=mozantech-test
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mozantech
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Keycloak configuration
kc.server-url=http://localhost:8081
kc.realm=mozantech
kc.client-id=mozantech-client
kc.client-secret=**********

# Security - OAuth2 Resource Server JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/mozantech
#configuracoes de email
app.mail.from=orders@mozantech.local
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

#Gerenciamento de logs
logging.file.name=${jboss.server.log.dir:logs}/orders.log